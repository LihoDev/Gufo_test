[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: ошибки
    "W",   # pycodestyle: предупреждения
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit: правила безопасности
]

[tool.ruff.lint.per-file-ignores]
# assert и тестовые «пароли» в тестах допустимы
"**/tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
